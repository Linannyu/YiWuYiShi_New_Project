<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 手势圣诞树 - 震撼全屏版</title>
    
    <!-- 引入艺术字体 Kaushan Script -->
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap" rel="stylesheet">
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #container { width: 100vw; height: 100vh; }
        
        #christmas-text-overlay {
            position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
            color: #ffd700; 
            font-family: 'Kaushan Script', cursive;
            font-size: clamp(2rem, 8vw, 4rem); 
            font-weight: 400;
            text-transform: none; 
            letter-spacing: 2px; 
            text-shadow: 0 0 15px #ff4500, 0 0 30px rgba(255, 69, 0, 0.5);
            pointer-events: none; z-index: 50; text-align: center;
            animation: glow 2.5s ease-in-out infinite alternate;
            width: 100%;
        }

        #gesture-hint {
            position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.7); font-size: 0.9rem; z-index: 50; text-align: center;
            background: rgba(0,0,0,0.5); padding: 8px 20px; border-radius: 30px;
            backdrop-filter: blur(5px);
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #ff4500; opacity: 0.8; transform: translateX(-50%) scale(1); }
            to { text-shadow: 0 0 25px #ff4500, 0 0 50px #ffd700; opacity: 1; transform: translateX(-50%) scale(1.05); }
        }

        #input_video { display: none; }

        .loading-screen {
            position: fixed; inset: 0; background: #000; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 999; color: #ffd700;
        }

        #redirect-indicator {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 215, 0, 0.9); color: #000; padding: 20px 40px;
            border-radius: 10px; font-weight: bold; font-size: 1.5rem;
            display: none; z-index: 1000; border: 4px solid #fff;
            box-shadow: 0 0 30px #ffd700;
        }
    </style>
</head>
<body>

    <div class="loading-screen" id="loading-screen">
        <p>很高兴您的观看和使用</p>
    </div>

    <div id="redirect-indicator">✨ 欢迎来到一五一实新闻网站 ✨</div>

    <div id="christmas-text-overlay">Merry Christmas</div>

    <video id="input_video" playsinline></video>
    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- 你可以在这里修改跳转的链接 ---
        const REDIRECT_URL = "https://sites.google.com/schools.nyc.gov/yiwuyishi-chinese-website/%E9%A6%96%E9%A1%B5"; 

        const IMAGE_URLS = Array.from({length: 10}, (_, i) => `https://picsum.photos/400/400?random=${i+25}`);

        const STATE = { CLOSED: 'CLOSED', SCATTERED: 'SCATTERED', TEXT: 'TEXT', PINCHED: 'PINCHED' };
        let currentState = STATE.CLOSED;
        let scene, camera, renderer, composer;
        let treeGroup, photoContainer;
        let treeElements = [], treeStar;
        let photoElements = []; 
        let snowSystem;
        let zoomedPhoto = null;
        let isRedirecting = false;

        const SNOW_COUNT = 60000; 
        const TREE_PARTICLE_COUNT = 4500; 

        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.4, 'rgba(255,255,255,0.7)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0015);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 3000);
            camera.position.set(0, 10, 150);

            renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('container').appendChild(renderer.domElement);

            const renderPass = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            composer = new EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bloomPass);

            scene.add(new THREE.AmbientLight(0xffffff, 2.5));

            treeGroup = new THREE.Group();
            photoContainer = new THREE.Group();
            scene.add(treeGroup);
            scene.add(photoContainer);

            initSnow();
            createTextCoords().then(coords => {
                initTree(coords);
                initStar();
                initPhotos(); 
                animate();
                document.getElementById('loading-screen').style.display = 'none';
            });

            window.addEventListener('resize', onWindowResize);
        }

        function initSnow() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [], velocities = [];
            for (let i = 0; i < SNOW_COUNT; i++) {
                vertices.push((Math.random() - 0.5) * 1600, (Math.random() * 1000) - 500, (Math.random() - 0.5) * 1600);
                velocities.push({ y: Math.random() * 1.5 + 0.5, x: (Math.random() - 0.5) * 0.2 });
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            
            snowSystem = new THREE.Points(geometry, new THREE.PointsMaterial({
                size: 1.5, 
                map: createGlowTexture(), 
                transparent: true, 
                opacity: 1.0, 
                blending: THREE.AdditiveBlending, 
                depthWrite: false
            }));
            snowSystem.userData.velocities = velocities;
            scene.add(snowSystem);
        }

        async function createTextCoords() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1500; canvas.height = 450;
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.font = 'bold 90px Arial';
            ctx.fillText("Merry Christmas", 750, 150);
            ctx.fillText("FDR", 750, 300);
            
            const data = ctx.getImageData(0, 0, 1500, 450).data;
            const points = [];
            for (let y = 0; y < 450; y += 4) {
                for (let x = 0; x < 1500; x += 4) {
                    if (data[(y * 1500 + x) * 4] > 128) {
                        points.push(new THREE.Vector3((x - 750) * 0.35, (225 - y) * 0.35 - 35, 0));
                    }
                }
            }
            return points;
        }

        function initTree(textCoords) {
            const matA = new THREE.MeshStandardMaterial({ color: 0xff3300, emissive: 0xff1100, emissiveIntensity: 5 });
            const matB = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff8800, emissiveIntensity: 4 });
            const matC = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 6 });

            for (let i = 0; i < TREE_PARTICLE_COUNT; i++) {
                const rand = Math.random();
                const mat = rand < 0.6 ? matA : (rand < 0.9 ? matB : matC);
                const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.48, 4, 4), mat.clone());
                
                const h = Math.random() * 105;
                const r = (105 - h) * 0.42;
                const a = Math.random() * Math.PI * 2;
                
                mesh.userData.closedPos = new THREE.Vector3(Math.cos(a) * r, h - 55, Math.sin(a) * r);
                mesh.userData.scatterPos = new THREE.Vector3((Math.random()-0.5)*400, (Math.random()-0.5)*300, (Math.random()-0.5)*300);
                const tc = textCoords[i % textCoords.length];
                mesh.userData.textPos = new THREE.Vector3(tc.x, tc.y, tc.z);
                
                mesh.position.copy(mesh.userData.closedPos);
                treeGroup.add(mesh);
                treeElements.push(mesh);
            }
        }

        function initStar() {
            const starShape = new THREE.Shape();
            const outerRadius = 10;
            const innerRadius = 5; 
            for(let i=0; i<10; i++){
                const r = i % 2 == 0 ? outerRadius : innerRadius;
                const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
                if(i == 0) starShape.moveTo(Math.cos(a) * r, Math.sin(a) * r);
                else starShape.lineTo(Math.cos(a) * r, Math.sin(a) * r);
            }
            
            treeStar = new THREE.Mesh(
                new THREE.ExtrudeGeometry(starShape, {
                    depth: 2, 
                    bevelEnabled: true,
                    bevelThickness: 1,
                    bevelSize: 0.8,
                    bevelSegments: 2
                }),
                new THREE.MeshStandardMaterial({
                    color: 0xffff00, 
                    emissive: 0xffcc00, 
                    emissiveIntensity: 1.5
                })
            );
            treeStar.position.y = 55;
            scene.add(treeStar);
        }

        function initPhotos() {
            const loader = new THREE.TextureLoader();
            IMAGE_URLS.forEach((url, index) => {
                const texture = loader.load(url);
                const frameGroup = new THREE.Group();
                
                const frameGeometry = new THREE.BoxGeometry(16, 16, 1.2);
                const frameMaterial = new THREE.MeshStandardMaterial({ color: 0x2a1a0a, roughness: 0.6, metalness: 0.1 });
                const frameBody = new THREE.Mesh(frameGeometry, frameMaterial);
                frameBody.renderOrder = 0;
                frameGroup.add(frameBody);

                const matGeometry = new THREE.PlaneGeometry(14, 14);
                const matMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
                const photoMat = new THREE.Mesh(matGeometry, matMaterial);
                photoMat.position.z = 0.605; 
                photoMat.renderOrder = 1;
                frameGroup.add(photoMat);

                const photoGeometry = new THREE.PlaneGeometry(12, 12);
                const photoMaterial = new THREE.MeshStandardMaterial({ map: texture, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });
                const photoMesh = new THREE.Mesh(photoGeometry, photoMaterial);
                photoMesh.position.z = 0.615; 
                photoMesh.renderOrder = 2;
                frameGroup.add(photoMesh);
                
                const backGeometry = new THREE.PlaneGeometry(15.8, 15.8);
                const backMaterial = new THREE.MeshStandardMaterial({ color: 0x111111 });
                const backBoard = new THREE.Mesh(backGeometry, backMaterial);
                backBoard.rotation.y = Math.PI;
                backBoard.position.z = -0.61;
                backBoard.renderOrder = 0;
                frameGroup.add(backBoard);

                const angle = (index / IMAGE_URLS.length) * Math.PI * 6;
                const radius = 65;
                const height = -40 + (index * 8.5);

                frameGroup.userData.closedPos = new THREE.Vector3(Math.cos(angle) * radius, height, Math.sin(angle) * radius);
                frameGroup.userData.scatterPos = new THREE.Vector3((Math.random()-0.5)*400, (Math.random()-0.5)*320, (Math.random()-0.5)*320);
                
                const tx = (index % 5 - 2) * 45;
                const ty = -65 - Math.floor(index / 5) * 25; 
                frameGroup.userData.textPos = new THREE.Vector3(tx, ty, 52);

                frameGroup.position.copy(frameGroup.userData.closedPos);
                photoContainer.add(frameGroup);
                photoElements.push(frameGroup);
            });
        }

        // 识别伸直手指的数量
        function countExtendedFingers(landmarks) {
            const fingerTips = [8, 12, 16, 20];
            let count = 0;
            // 食指、中指、无名指、小拇指
            fingerTips.forEach(tip => {
                if (landmarks[tip].y < landmarks[tip - 2].y) count++;
            });
            // 大拇指检测 (基于x坐标)
            const isLeftHand = landmarks[0].x > landmarks[17].x;
            if (isLeftHand) {
                if (landmarks[4].x > landmarks[3].x) count++;
            } else {
                if (landmarks[4].x < landmarks[3].x) count++;
            }
            return count;
        }

        function onResults(results) {
            if (isRedirecting) return;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                // 跳转逻辑：如果是双手
                if (results.multiHandLandmarks.length >= 2) {
                    let totalFingers = 0;
                    results.multiHandLandmarks.forEach(lm => {
                        totalFingers += countExtendedFingers(lm);
                    });
                    
                    if (totalFingers >= 8) { // 理想是10根，取8根提高容错
                        triggerRedirect();
                        return;
                    }
                }

                const lm = results.multiHandLandmarks[0];
                const distPinch = Math.sqrt(Math.pow(lm[4].x - lm[8].x, 2) + Math.pow(lm[4].y - lm[8].y, 2));
                
                const isPinch = distPinch < 0.05 && lm[12].y < lm[10].y; 
                const isVictory = lm[8].y < lm[6].y && lm[12].y < lm[10].y && lm[16].y > lm[14].y;
                const isFist = lm[8].y > lm[6].y && lm[12].y > lm[10].y && lm[16].y > lm[14].y;

                if (isPinch) {
                    if (currentState !== STATE.PINCHED) {
                        zoomedPhoto = photoElements[Math.floor(Math.random() * photoElements.length)];
                        transitionTo(STATE.PINCHED);
                    }
                } else if (isVictory) {
                    transitionTo(STATE.TEXT);
                } else if (isFist) {
                    transitionTo(STATE.CLOSED);
                } else {
                    transitionTo(STATE.SCATTERED);
                }
            } else {
                if (currentState !== STATE.CLOSED) transitionTo(STATE.CLOSED);
            }
        }

        function triggerRedirect() {
            isRedirecting = true;
            const indicator = document.getElementById('redirect-indicator');
            indicator.style.display = 'block';
            
            // 延迟跳转，给用户一点反馈感
            setTimeout(() => {
                window.location.href = REDIRECT_URL;
            }, 1500);
        }

        function transitionTo(newState) {
            if (currentState === newState) return;
            currentState = newState;
            const duration = 1.0;

            if (newState !== STATE.PINCHED) {
                const treeKey = (newState === STATE.TEXT) ? 'textPos' : (newState === STATE.SCATTERED ? 'scatterPos' : 'closedPos');
                treeElements.forEach(el => {
                    gsap.to(el.position, { x: el.userData[treeKey].x, y: el.userData[treeKey].y, z: el.userData[treeKey].z, duration, ease: "power2.inOut" });
                });
            }

            if (newState === STATE.PINCHED && zoomedPhoto) {
                photoElements.forEach(p => {
                    if (p === zoomedPhoto) {
                        const worldTarget = new THREE.Vector3(0, 5, 105); 
                        photoContainer.worldToLocal(worldTarget); 
                        gsap.to(p.position, { x: worldTarget.x, y: worldTarget.y, z: worldTarget.z, duration: 0.6, ease: "back.out(1.2)" });
                        gsap.to(p.scale, { x: 2.5, y: 2.5, z: 2.5, duration: 0.6 });
                    } else {
                        gsap.to(p.scale, { x: 0, y: 0, z: 0, duration: 0.4 });
                    }
                });
            } else {
                zoomedPhoto = null;
                const photoKey = (newState === STATE.TEXT) ? 'textPos' : (newState === STATE.SCATTERED ? 'scatterPos' : 'closedPos');
                photoElements.forEach(p => {
                    gsap.to(p.scale, { x: 1, y: 1, z: 1, duration: 0.8 });
                    const targetPos = p.userData[photoKey];
                    gsap.to(p.position, { x: targetPos.x, y: targetPos.y, z: targetPos.z, duration: 0.8, ease: "power2.out" });
                });
            }

            if (newState === STATE.TEXT) {
                gsap.to(camera.position, { z: 230, y: 0, duration });
            } else {
                gsap.to(camera.position, { z: 160, y: 10, duration });
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            if (treeStar) treeStar.rotation.z += 0.03;

            if (currentState === STATE.TEXT) {
                treeGroup.rotation.y = THREE.MathUtils.lerp(treeGroup.rotation.y, 0, 0.05);
                photoContainer.rotation.y = THREE.MathUtils.lerp(photoContainer.rotation.y, 0, 0.05);
                photoElements.forEach(p => p.lookAt(camera.position));
            } else if (currentState === STATE.PINCHED) {
                if(zoomedPhoto) zoomedPhoto.lookAt(camera.position);
            } else {
                treeGroup.rotation.y += 0.008;
                photoContainer.rotation.y = treeGroup.rotation.y;
                photoElements.forEach((p, i) => {
                    p.lookAt(camera.position);
                    if (currentState === STATE.SCATTERED) {
                        p.position.y += Math.sin(time + i) * 0.12;
                    }
                });
            }

            const positions = snowSystem.geometry.attributes.position.array;
            for (let i = 0; i < SNOW_COUNT; i++) {
                positions[i * 3 + 1] -= snowSystem.userData.velocities[i].y;
                positions[i * 3] += Math.sin(time + i) * 0.05;
                if (positions[i * 3 + 1] < -500) positions[i * 3 + 1] = 500;
            }
            snowSystem.geometry.attributes.position.needsUpdate = true;
            
            composer.render();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        init();

        const videoElement = document.getElementById('input_video');
        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        
        // 修改配置以支持检测双手 (maxNumHands: 2)
        hands.setOptions({ 
            maxNumHands: 2, 
            modelComplexity: 1, 
            minDetectionConfidence: 0.7, 
            minTrackingConfidence: 0.7 
        });
        
        hands.onResults(onResults);
        const cameraInstance = new Camera(videoElement, {
            onFrame: async () => { await hands.send({ image: videoElement }); },
            width: 640, height: 480
        });
        cameraInstance.start();
    </script>
</body>
</html>
