<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采访的展示</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'ZCOOL KuaiLe', "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
            color: #242933;
            background: transparent;
        }

        /* ── 整页网格底纹 ── */
        .mihoyo-section {
            position: relative;
            padding: 0 0 64px;
            background: transparent;
        }

        /* 固定画布，整体缩放（米哈游同款比例） */
        .stage-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .stage {
            position: relative;
            width: 1360px;
            height: 660px;
            flex-shrink: 0;
            transform-origin: top center;
        }

        /* 左侧竖排字 */
        .side-label {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            writing-mode: vertical-rl;
            font-size: 10px;
            letter-spacing: 0.42em;
            color: #c8cdd6;
            white-space: nowrap;
            text-transform: uppercase;
            user-select: none;
        }

        /* ── 左侧文字区（独立，不被图片遮挡） ── */
        .news-content {
            position: absolute;
            left: 108px;
            top: 0;
            width: 400px;
            height: 500px;
            z-index: 10;
        }

        .news-content::before {
            content: '';
            position: absolute;
            left: -24px;
            top: 6px;
            width: 5px;
            height: 68px;
            background: #3778e5;
        }

        .news-date {
            margin-bottom: 32px;
            transition: opacity 0.35s;
        }

        .news-date .date {
            font-size: 108px;
            font-weight: 300;
            color: #dee1e6;
            line-height: 0.92;
            letter-spacing: -3px;
        }

        .news-date .year {
            font-size: 32px;
            color: #dee1e6;
            font-weight: 300;
            margin-top: 2px;
            padding-left: 2px;
        }

        .news-title {
            font-size: 30px;
            font-weight: 700;
            color: #242933;
            margin-bottom: 18px;
            line-height: 1.42;
            cursor: pointer;
            transition: color 0.3s, opacity 0.35s;
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            text-overflow: ellipsis;
            min-height: calc(30px * 1.42 * 2);
        }

        .news-title:hover { color: #3778e5; }

        .news-desc {
            font-size: 14px;
            line-height: 1.9;
            color: #676b73;
            height: calc(14px * 1.9 * 4);
            margin-bottom: 28px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 4;
            line-clamp: 4;
            text-overflow: ellipsis;
            transition: opacity 0.35s;
        }

        .fade-out { opacity: 0 !important; }

        .news-footer {
            position: absolute;
            left: 0;
            top: 408px;
            width: 100%;
        }

        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #3778e5;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 0.04em;
            margin-bottom: 32px;
            border-bottom: 1px solid transparent;
            padding-bottom: 2px;
            transition: border-color 0.2s;
        }

        .read-more:hover { border-bottom-color: #3778e5; }

        .read-more .arrows {
            font-size: 11px;
            letter-spacing: -1px;
        }

        .pagination {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .page-btn {
            width: 42px;
            height: 42px;
            border: 1px solid #dee1e6;
            background: transparent;
            color: #dee1e6;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-btn:hover {
            color: #3778e5;
            border-color: #3778e5;
        }

        .page-btn.active {
            color: #676b73;
            border-color: #676b73;
        }

        .page-btn.nav-btn {
            background: #242933;
            color: #fff;
            border-color: #242933;
        }

        /* ── 右侧视觉区 ── */
        .visual-area {
            position: absolute;
            left: 480px;
            top: 0;
            width: 800px;
            height: 540px;
            transition: opacity 0.48s cubic-bezier(0.32, 0.72, 0, 1),
                        transform 0.48s cubic-bezier(0.32, 0.72, 0, 1),
                        filter 0.4s ease;
        }

        .news-banner {
            display: block;
            width: 100%;
            height: 100%;
            text-decoration: none;
            color: inherit;
            position: relative;
        }

        /* 背景层：同一张图模糊 + 斜纹（米哈游原版逻辑） */
        .stripe-deco {
            position: absolute;
            right: 24px;
            top: 12px;
            width: 440px;
            height: 520px;
            overflow: hidden;
            z-index: 1;
            transition: opacity 0.35s;
        }

        .stripe-bg-img {
            position: absolute;
            inset: -5%;
            width: 110%;
            height: 110%;
            object-fit: cover;
            object-position: center center;
            filter: blur(1px) brightness(1.04) saturate(0.95);
            opacity: 0.72;
            transition: opacity 0.35s, transform 0.5s;
        }

        .stripe-pattern {
            position: absolute;
            inset: 0;
            z-index: 1;
            background-color: rgba(232, 235, 240, 0.48);
            background-image: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 4px,
                rgba(255, 255, 255, 0.82) 4px,
                rgba(255, 255, 255, 0.82) 7px
            );
            pointer-events: none;
        }

        /* 主图 */
        .banner-main {
            position: absolute;
            left: 300px;
            top: 72px;
            width: 400px;
            height: 380px;
            z-index: 3;
            overflow: hidden;
            background: transparent;
            transition: opacity 0.35s;
        }

        /* ── 科技感换页动效 ── */
        .tech-overlay {
            position: absolute;
            inset: 0;
            z-index: 40;
            pointer-events: none;
            overflow: hidden;
        }

        .tech-scan {
            position: absolute;
            left: -10%;
            width: 120%;
            height: 2px;
            top: 0;
            opacity: 0;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(55, 120, 229, 0.2) 20%,
                #5ee7ff 50%,
                rgba(55, 120, 229, 0.2) 80%,
                transparent 100%);
            box-shadow: 0 0 16px rgba(94, 231, 255, 0.9), 0 0 32px rgba(55, 120, 229, 0.5);
        }

        .stage.tech-active .tech-scan {
            animation: techScanMove 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .tech-flash {
            position: absolute;
            inset: 0;
            opacity: 0;
            background:
                linear-gradient(rgba(55, 120, 229, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(55, 120, 229, 0.06) 1px, transparent 1px),
                radial-gradient(ellipse at 70% 40%, rgba(55, 120, 229, 0.12), transparent 55%);
            background-size: 24px 24px, 24px 24px, 100% 100%;
        }

        .stage.tech-active .tech-flash {
            animation: techFlashPulse 0.72s ease forwards;
        }

        .news-content {
            transition: none;
        }

        .news-content.tech-out {
            animation: techContentOut 0.42s cubic-bezier(0.55, 0, 1, 0.45) forwards;
        }

        .news-content.tech-in .news-date {
            animation: techTextReveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.06s both;
        }

        .news-content.tech-in .news-title {
            animation: techTextReveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.16s both;
        }

        .news-content.tech-in .news-desc {
            animation: techTextReveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.26s both;
        }

        .news-content.tech-in::before {
            animation: techBarGrow 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.02s both;
        }

        .visual-area.tech-out {
            animation: techVisualOut 0.42s cubic-bezier(0.55, 0, 1, 0.45) forwards;
        }

        .visual-area.tech-in .stripe-deco {
            animation: techStripeIn 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both;
        }

        .visual-area.tech-in .banner-main img {
            animation: techImageIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .visual-area.tech-in .banner-text {
            animation: techTextReveal 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
        }

        .banner-main::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            background: linear-gradient(105deg,
                transparent 38%,
                rgba(255, 255, 255, 0.08) 46%,
                rgba(94, 231, 255, 0.22) 50%,
                rgba(255, 255, 255, 0.08) 54%,
                transparent 62%);
            transform: translateX(-120%);
            opacity: 0;
        }

        .visual-area.tech-in .banner-main::after {
            animation: techShine 0.85s ease 0.25s forwards;
        }

        @keyframes techScanMove {
            0% { top: 0; opacity: 0; }
            8% { opacity: 1; }
            92% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        @keyframes techFlashPulse {
            0%, 100% { opacity: 0; }
            35% { opacity: 0.85; }
            70% { opacity: 0.35; }
        }

        @keyframes techContentOut {
            to {
                opacity: 0;
                transform: translateX(-28px) skewX(-1.5deg);
                filter: blur(10px) brightness(1.15);
                clip-path: inset(0 100% 0 0);
            }
        }

        @keyframes techVisualOut {
            to {
                opacity: 0;
                transform: translateX(36px) scale(1.03);
                filter: blur(12px) contrast(1.2) saturate(0.6);
                clip-path: inset(0 0 0 100%);
            }
        }

        @keyframes techTextReveal {
            from {
                opacity: 0;
                transform: translateY(18px);
                clip-path: inset(100% 0 0 0);
                filter: blur(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                clip-path: inset(0 0 0 0);
                filter: blur(0);
            }
        }

        @keyframes techBarGrow {
            from {
                height: 0;
                box-shadow: none;
            }
            to {
                height: 68px;
                box-shadow: 0 0 14px rgba(55, 120, 229, 0.55);
            }
        }

        @keyframes techImageIn {
            0% {
                opacity: 0;
                transform: scale(1.1);
                clip-path: inset(0 0 0 100%);
                filter: blur(14px) saturate(0.4) brightness(0.8);
            }
            45% {
                filter: blur(3px) saturate(1.3) brightness(1.08);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                clip-path: inset(0 0 0 0);
                filter: blur(0) saturate(1) brightness(1);
            }
        }

        @keyframes techStripeIn {
            from {
                opacity: 0;
                transform: translateX(40px);
                filter: blur(4px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
                filter: blur(0);
            }
        }

        @keyframes techShine {
            0% { transform: translateX(-120%); opacity: 0; }
            15% { opacity: 1; }
            100% { transform: translateX(120%); opacity: 0; }
        }

        .banner-main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
            transition: transform 0.5s, opacity 0.35s;
        }

        .news-banner:hover .banner-main img {
            transform: scale(1.03);
        }

        .banner-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 4;
            color: #fff;
            font-size: 36px;
            font-weight: 700;
            text-shadow: 0 2px 24px rgba(0, 0, 0, 0.55);
            letter-spacing: 0.06em;
            pointer-events: none;
            text-align: center;
            padding: 24px 24px 52px;
            white-space: pre-line;
            line-height: 1.25;
        }

        /* 底部「查看更多」按钮 */
        .view-more-wrap {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
        }

        .view-more-btn {
            display: inline-block;
            padding: 14px 72px;
            font-size: 14px;
            color: #676b73;
            text-decoration: none;
            border: 1px solid #c5cad3;
            background: transparent;
            clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 16px 100%, 0 50%);
            transition: color 0.2s, border-color 0.2s;
        }

        .view-more-btn:hover {
            color: #3778e5;
            border-color: #3778e5;
        }

        /* ── 响应式 ── */

        /* 笔记本 / 小桌面：等比缩放 */
        @media (max-width: 1400px) and (min-width: 901px) {
            .stage {
                transform: scale(calc((100vw - 32px) / 1360));
            }
            .stage-wrap {
                height: calc(660px * ((100vw - 32px) / 1360));
            }
        }

        /* iPad 竖屏 / 小平板：等比缩放 */
        @media (max-width: 900px) and (min-width: 601px) {
            .mihoyo-section {
                padding: 0 0 48px;
            }
            .stage {
                transform: scale(calc((100vw - 24px) / 1360));
            }
            .stage-wrap {
                height: calc(660px * ((100vw - 24px) / 1360));
            }
        }

        /* 手机：纵向堆叠布局 */
        @media (max-width: 600px) {
            .mihoyo-section {
                padding: 0 0 32px;
            }

            .stage-wrap {
                height: auto;
                overflow: visible;
            }

            .stage {
                width: 100%;
                height: auto;
                transform: none;
                padding: 0 16px;
                display: flex;
                flex-direction: column;
                gap: 28px;
            }

            .side-label {
                display: none;
            }

            .news-content {
                position: relative;
                left: auto;
                top: auto;
                width: 100%;
                height: auto;
                padding-left: 20px;
            }

            .news-content::before {
                left: 0;
            }

            .news-date .date {
                font-size: 72px;
            }

            .news-date .year {
                font-size: 24px;
            }

            .news-title {
                font-size: 22px;
                min-height: auto;
            }

            .news-desc {
                height: auto;
                -webkit-line-clamp: 5;
                line-clamp: 5;
            }

            .news-footer {
                position: relative;
                top: auto;
                margin-top: 4px;
            }

            .read-more {
                margin-bottom: 20px;
            }

            .page-btn {
                width: 38px;
                height: 38px;
                font-size: 14px;
            }

            .visual-area {
                position: relative;
                left: auto;
                top: auto;
                width: 100%;
                height: 360px;
            }

            .stripe-deco {
                right: 8%;
                top: 24px;
                width: 72%;
                height: 300px;
            }

            .banner-main {
                left: 50%;
                top: 48px;
                transform: translateX(-58%);
                width: 78%;
                max-width: 320px;
                height: 280px;
            }

            .news-banner:hover .banner-main img {
                transform: scale(1.03);
            }

            .banner-text {
                font-size: 28px;
                padding-bottom: 36px;
            }

            .view-more-wrap {
                position: relative;
                bottom: auto;
                left: auto;
                transform: none;
                text-align: center;
                margin-top: 4px;
            }

            .view-more-btn {
                padding: 12px 48px;
                font-size: 13px;
            }
        }

        /* 超小屏手机 */
        @media (max-width: 380px) {
            .news-date .date {
                font-size: 60px;
            }

            .news-title {
                font-size: 20px;
            }

            .visual-area {
                height: 320px;
            }

            .banner-main {
                height: 240px;
            }

            .stripe-deco {
                height: 260px;
            }
        }
    </style>
</head>

            </div>
        </div>
    </section>

        let currentGroup = 0;
        let activeIndex = 0;
        let isInitial = true;
        let isAnimating = false;
        const itemsPerGroup = 4;

        const newsContent = document.getElementById('newsContent');
        const visualArea = document.getElementById('visualArea');
        const stage = document.querySelector('.stage');

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function resetTechAnim() {
            stage.classList.remove('tech-active');
            newsContent.classList.remove('tech-out', 'tech-in');
            visualArea.classList.remove('tech-out', 'tech-in');
        }

        function applyImagePosition(mainImg, bgImg, src) {
            const temp = new Image();
            temp.onload = () => {
                const pos = temp.height > temp.width ? 'center 18%' : 'center center';
                mainImg.style.objectPosition = pos;
                bgImg.style.objectPosition = pos;
            };
            temp.src = src;
        }

        function applyNewsContent(data) {
            document.getElementById('dateText').textContent = data.date;
            document.getElementById('yearText').textContent = data.year;
            document.getElementById('newsTitle').textContent = data.title;
            document.getElementById('newsDesc').textContent = data.desc;
            document.getElementById('bannerText').innerText = data.text;
            document.getElementById('readMoreBtn').href = data.link;
            document.getElementById('bannerLink').href = data.link;

            const mainImg = document.getElementById('mainImage');
            const bgImg = document.getElementById('bgImage');
            mainImg.src = data.image;
            bgImg.src = data.image;
            applyImagePosition(mainImg, bgImg, data.image);
            renderPagination();
        }

        async function switchNews(index, skipAnim = false) {
            const data = newsData[index];
            if (!data || (index === activeIndex && !skipAnim)) return;
            if (isAnimating) return;

            activeIndex = index;

            if (skipAnim || isInitial) {
                applyNewsContent(data);
                return;
            }

            isAnimating = true;
            isInitial = false;

            stage.classList.add('tech-active');
            newsContent.classList.add('tech-out');
            visualArea.classList.add('tech-out');

            await wait(420);

            applyNewsContent(data);

            newsContent.classList.remove('tech-out');
            visualArea.classList.remove('tech-out');
            void newsContent.offsetWidth;

            newsContent.classList.add('tech-in');
            visualArea.classList.add('tech-in');

            await wait(820);

            resetTechAnim();
            isAnimating = false;
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            container.innerHTML = '';

            if (currentGroup > 0) {
                const prevBtn = document.createElement('div');
                prevBtn.className = 'page-btn nav-btn';
                prevBtn.textContent = '<';
                prevBtn.onclick = () => { isInitial = false; currentGroup--; renderPagination(); };
                container.appendChild(prevBtn);
            }

            const startIdx = currentGroup * itemsPerGroup;
            const endIdx = startIdx + itemsPerGroup;

            for (let i = startIdx; i < endIdx && i < newsData.length; i++) {
                const btn = document.createElement('div');
                btn.className = `page-btn ${!isInitial && i === activeIndex ? 'active' : ''}`;
                btn.textContent = i + 1;
                btn.onclick = () => { isInitial = false; switchNews(i); };
                container.appendChild(btn);
            }

            if (endIdx < newsData.length) {
                const nextBtn = document.createElement('div');
                nextBtn.className = 'page-btn nav-btn';
                nextBtn.textContent = '>';
                nextBtn.onclick = () => { isInitial = false; currentGroup++; renderPagination(); };
                container.appendChild(nextBtn);
            }
        }

        window.onload = () => {
            isInitial = true;
            currentGroup = 0;
            switchNews(Math.floor(Math.random() * newsData.length), true);
        };
    </script>
